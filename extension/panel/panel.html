<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="panel.css">
<title>Condi</title>
</head>
<body>
  <header>
    <h1>Condi</h1>
    <span id="target" class="target">설정을 불러오세요</span>
  </header>

  <nav class="tabs">
    <button class="tab is-active" data-tab="run">실행</button>
    <button class="tab" data-tab="config">설정</button>
    <button class="tab" data-tab="selectors">셀렉터</button>
  </nav>

  <!-- 실행 탭 -->
  <section id="panel-run" class="pane is-active">
    <div class="conditions">
      <h2>조건</h2>
      <div id="condition-fields" class="fields">
        <p class="empty">설정을 불러오면 조건이 여기에 표시됩니다.</p>
      </div>
    </div>

    <button id="run" class="primary" disabled>실행</button>

    <div class="results">
      <h2>결과 <span id="summary" class="summary"></span></h2>
      <ol id="log" class="log"><li class="empty">아직 실행하지 않았습니다.</li></ol>
    </div>
  </section>

  <!-- 설정 탭 -->
  <section id="panel-config" class="pane">
    <div class="row">
      <input type="file" id="file" accept=".json" hidden>
      <button id="load-file">파일에서 불러오기</button>
      <button id="format">정렬</button>
      <button id="download">내보내기</button>
    </div>
    <p id="config-status" class="status"></p>
    <textarea id="config" spellcheck="false" placeholder="Condi 설정 JSON을 붙여넣으세요"></textarea>
  </section>

  <!-- 셀렉터 탭 -->
  <section id="panel-selectors" class="pane">
    <p class="hint">페이지에서 요소를 클릭하면 셀렉터가 설정에 추가됩니다. <kbd>Esc</kbd>로 취소합니다.</p>
    <button id="pick" class="primary">요소 선택 시작</button>
    <ul id="selector-list" class="selectors"><li class="empty">설정에 셀렉터가 없습니다.</li></ul>
  </section>

  <script type="module" src="panel.js"></script>
</body>
</html>
