name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Type-check & config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      # loadConfig()가 playwright.config.ts에서 실행되므로,
      # --list 만으로 설정 스키마 검증 + 픽스처 결선까지 확인된다.
      - name: Validate config & discover tests
        run: npx playwright test --list

      # 저장소에 커밋된 모든 프로필이 스키마를 만족하는지 확인
      - name: Validate every config profile
        run: |
          for f in config/*.json; do
            echo "--- $f ---"
            CONDI_CONFIG="$f" npx playwright test --list > /dev/null
          done

  # ── CI 통과 시 자동 머지 ──
  # GitHub 네이티브 auto-merge는 Free 플랜 비공개 저장소에서 사용할 수 없어,
  # validate 잡 성공을 전제로 Actions가 직접 squash 머지한다.
  # needs: validate 덕분에 CI가 실패하면 이 잡은 아예 실행되지 않는다.
  auto-merge:
    name: Auto-merge on green
    needs: validate
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      contains(github.event.pull_request.labels.*.name, 'automerge')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Squash merge the pull request
        run: gh pr merge "$PR_URL" --squash --delete-branch
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
