name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # 기본값은 [opened, synchronize, reopened] 라 labeled 가 빠진다.
    # 라벨은 PR 생성 직후 붙으므로 opened 시점엔 아직 없을 수 있고,
    # labeled 가 없으면 auto-merge 잡을 다시 평가할 기회가 사라진다.
    types: [opened, synchronize, reopened, labeled, ready_for_review]

permissions:
  contents: read

jobs:
  validate:
    name: Type-check & config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      # 확장의 공유 모듈이 core/template.js 와 갈라지지 않았는지 확인
      - name: Check extension module sync
        run: npm run check:ext

      # loadConfig()가 playwright.config.ts에서 실행되므로,
      # --list 만으로 설정 스키마 검증 + 픽스처 결선까지 확인된다.
      - name: Validate config & discover tests
        run: npx playwright test --list

      # 저장소에 커밋된 모든 프로필이 스키마를 만족하는지 확인
      - name: Validate every config profile
        run: |
          for f in config/*.json; do
            echo "--- $f ---"
            CONDI_CONFIG="$f" npx playwright test --list > /dev/null
          done

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # 실행기·피커·확장 전체 파이프라인 — 모두 로컬 목 서버만 쓰므로
      # 실제 타겟 없이 CI에서 항상 실행 가능하다.
      # (tests/example-conditional-flow.spec.ts 는 실제 타겟이 필요해 제외)
      - name: Test engine, picker and full extension pipeline
        run: npx playwright test tests/template.spec.ts tests/ui-runner.spec.ts tests/picker.spec.ts tests/extension-e2e.spec.ts

  # ── CI 통과 시 자동 머지 ──
  # GitHub 네이티브 auto-merge를 켜기만 한다. 실제 병합 시점은 GitHub가 판단하며,
  # 브랜치 룰셋의 required status check가 전부 통과해야 병합된다.
  # Vercel을 연결한 뒤 배포 체크를 required로 추가하면 그것까지 기다린다.
  auto-merge:
    name: Arm auto-merge
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      contains(github.event.pull_request.labels.*.name, 'automerge')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        run: gh pr merge "$PR_URL" --auto --squash --delete-branch
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
